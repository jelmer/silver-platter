[package]
name = "svp-client"
version = "0.2.0"
authors = ["Jelmer Vernooĳ <jelmer@jelmer.uk>"]
edition = "2021"
license = "Apache-2.0"
description = "Client for the silver-platter protocol"

[lib]

[dependencies]
log = ">=0.4"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile = "3"
